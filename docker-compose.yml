# Local development dependencies only. The app and worker run on the host with pnpm dev.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uptimewatch
      POSTGRES_PASSWORD: uptimewatch
      POSTGRES_DB: uptimewatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimewatch -d uptimewatch"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction so queued jobs are never dropped under memory pressure.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  redisdata:
